<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paper Visualizer 的三个交互式论文可视化展示。">
  <title>Paper Visualizer · Showcase</title>
  <style>
    :root{--bg:#f4f0e8;--surface:#fffdf8;--ink:#18221d;--muted:#657169;--line:#d5cfc2;--accent:#b85d26;--accent-soft:#f8e2d0;--focus:#315ea8;--shadow:0 15px 42px rgba(28,38,32,.12);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color-scheme:light}
    *{box-sizing:border-box}body{min-width:320px;margin:0;background:var(--bg);color:var(--ink)}a,button{font:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.skip{position:fixed;top:-60px;left:16px;z-index:10;padding:10px 14px;border-radius:8px;background:var(--ink);color:#fff;text-decoration:none}.skip:focus{top:14px}.top{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg),transparent 5%);backdrop-filter:blur(14px)}.top-inner{display:grid;grid-template-columns:minmax(210px,1fr) auto auto;gap:18px;align-items:center;width:min(1400px,calc(100% - 32px));min-height:72px;margin:auto}.brand{font-weight:850;letter-spacing:-.03em}.brand b{color:var(--accent)}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}.tabs{display:flex;gap:6px;max-width:780px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}.tabs button{flex:0 0 auto;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}.tabs button:hover{border-color:var(--accent);color:var(--ink)}.tabs button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}.open{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--focus);font-size:13px;font-weight:750;text-decoration:none;white-space:nowrap}.open:hover{border-color:var(--focus)}main{width:min(1400px,calc(100% - 32px));margin:auto}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:20px 0 15px}.intro p{max-width:720px;margin:0;color:var(--muted);font-size:14px;line-height:1.6}.current{margin:0;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.frame-shell{overflow:hidden;margin-bottom:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}iframe{display:block;width:100%;height:calc(100dvh - 170px);min-height:660px;border:0;background:var(--surface)}.fallback{padding:22px;color:var(--muted)}.fallback a{color:var(--focus)}footer{padding:0 0 28px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:980px){.top-inner{grid-template-columns:1fr auto;gap:6px;min-height:unset;padding:11px 0}.tabs{grid-column:1/-1;grid-row:2}.intro{padding-top:15px}iframe{height:calc(100dvh - 204px);min-height:600px}}@media(max-width:560px){.top-inner,main{width:min(100% - 20px,1400px)}.brand small{display:none}.open{font-size:12px}.intro{display:block}.current{margin-top:10px}iframe{height:calc(100dvh - 216px);min-height:520px}.frame-shell{border-radius:11px}}
  </style>
</head>
<body>
  <a class="skip" href="#viewer">跳到论文展示</a>
  <header class="top">
    <div class="top-inner">
      <div class="brand">Paper<b>·</b>Visualizer <small>交互式论文可视化展示</small></div>
      <nav class="tabs" aria-label="选择展示页面" role="tablist">
        <button type="button" role="tab" id="tab-attention-v6" aria-controls="viewer" aria-selected="true" data-page="attention-v6">Attention · Visualizer v6</button>
        <button type="button" role="tab" id="tab-attention-explorer" aria-controls="viewer" aria-selected="false" data-page="attention-explorer">Attention · ZCode Demo</button>
        <button type="button" role="tab" id="tab-flexibility" aria-controls="viewer" aria-selected="false" data-page="flexibility">Flexibility Trap · ZCode Demo</button>
      </nav>
      <a class="open" id="openCurrent" href="pages/attention-v6.html" target="_blank" rel="noopener">新标签打开 ↗</a>
    </div>
  </header>
  <main>
    <section class="intro" aria-live="polite">
      <p id="pageDescription">当前 Visualizer v6 流水线生成的 Attention Is All You Need 页面。</p>
      <p class="current" id="currentLabel">Attention · Visualizer v6</p>
    </section>
    <section class="frame-shell" id="viewer" aria-label="论文可视化展示">
      <iframe id="showcaseFrame" title="Attention · Visualizer v6" src="pages/attention-v6.html" allow="clipboard-write"></iframe>
    </section>
    <noscript><p class="fallback">请启用 JavaScript，或直接打开 <a href="pages/attention-v6.html">Attention v6</a>、<a href="pages/attention-interactive-explorer.html">Attention ZCode Demo</a>、<a href="pages/flexibility-trap-interactive-explorer.html">Flexibility Trap ZCode Demo</a>。</p></noscript>
    <footer>三个页面均为独立交互页；按钮只切换展示，不修改页面内容。</footer>
  </main>
  <script>
    const pages = {
      "attention-v6": {label: "Attention · Visualizer v6", title: "Attention · Visualizer v6", src: "pages/attention-v6.html", description: "当前 Visualizer v6 流水线生成的 Attention Is All You Need 页面。"},
      "attention-explorer": {label: "Attention · ZCode Demo", title: "Attention Is All You Need · ZCode Demo", src: "pages/attention-interactive-explorer.html", description: "用 ZCode 独立制作的 Attention Is All You Need 交互式论文解读。"},
      flexibility: {label: "Flexibility Trap · ZCode Demo", title: "The Flexibility Trap · ZCode Demo", src: "pages/flexibility-trap-interactive-explorer.html", description: "用 ZCode 独立制作的 The Flexibility Trap 交互式论文解读。"}
    };
    const frame = document.querySelector("#showcaseFrame");
    const openCurrent = document.querySelector("#openCurrent");
    const description = document.querySelector("#pageDescription");
    const label = document.querySelector("#currentLabel");
    const tabs = [...document.querySelectorAll("[data-page]")];
    function activate(id, writeHistory = true) {
      const page = pages[id] || pages["attention-v6"];
      const activeId = pages[id] ? id : "attention-v6";
      frame.src = page.src;
      frame.title = page.title;
      openCurrent.href = page.src;
      description.textContent = page.description;
      label.textContent = page.label;
      tabs.forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.page === activeId)));
      if (writeHistory) {
        const url = new URL(window.location.href);
        url.searchParams.set("page", activeId);
        history.replaceState({page: activeId}, "", url);
      }
    }
    tabs.forEach((tab) => tab.addEventListener("click", () => activate(tab.dataset.page)));
    const requested = new URLSearchParams(window.location.search).get("page");
    if (requested && pages[requested]) activate(requested, false);
    window.addEventListener("popstate", () => activate(new URLSearchParams(window.location.search).get("page"), false));
  </script>
</body>
</html>
